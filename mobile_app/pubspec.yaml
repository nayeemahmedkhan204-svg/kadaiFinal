name: kadaikhata
description: "KadaiKhata - Smart Shop Billing, Inventory, POS & Khata Management for Indian Retailers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  provider: ^6.1.2

  # Networking & REST API
  http: ^1.2.1

  # Local Persistence & Offline Sync
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0

  # Formatting & Localization
  intl: ^0.19.0

  # PDF Generation, Printing & Sharing
  pdf: ^3.10.8
  printing: ^5.13.1
  share_plus: ^9.0.0

  # Bluetooth Thermal ESC/POS Printing
  blue_thermal_printer: ^1.2.3

  # UPI QR Code
  qr_flutter: ^4.1.0

  # Dashboard Charts
  fl_chart: ^0.68.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
